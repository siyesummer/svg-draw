server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type application/json;
        add_header Cache-Control no-store always;
        return 200 '{"code":0,"service":"svg-draw","status":"ok"}';
    }

    location = /release.json {
        add_header Cache-Control no-store always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

